<!DOCTYPE html>
<html lang="En">
<head>
    <meta charset="UTF-8"/>
    <link href="assets/fav.ico" rel="icon">
    <title>Tiny Graphics</title>
</head>
<body style="background: White">
  <!-- Add tabindex="1" so that this div can receive focus and key events. -->
  <div class="canvas-widget" id="main-canvas" tabindex="1"></div>
  <script type=module>
      // Entry point for your program.
      const element_to_replace = document.querySelector("#main-canvas");
      // Optional: when the canvas is clicked, focus it.
      element_to_replace.addEventListener("click", () => element_to_replace.focus());
      import {Main_Scene, Additional_Scenes, Canvas_Widget} from './main-scene.js';
      const scenes = [Main_Scene, ...Additional_Scenes].map(scene => new scene());
      new Canvas_Widget(element_to_replace, scenes);
  </script>
</body>
</html>
